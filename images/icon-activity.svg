<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Monochrome activity-bar variant of images/icon.svg. VS Code uses view
    container icons as an alpha mask and colors them from the theme, so the
    mark is a currentColor disc with the original's shapes knocked out: the
    "12", the cursor circle with its triangle left solid inside, and the
    1, 2, 3 above and below that shrink along the rim. The digits are stroked
    paths, so the mark does not depend on a font being installed.
  -->
  <defs>
    <path id="d1" d="M 12 24 L 36 8 L 36 92"/>
    <path id="d2" d="M 8 30 C 8 10, 52 4, 52 30 C 52 50, 20 66, 8 92 L 54 92"/>
    <path id="d3" d="M 10 16 C 26 2, 52 8, 50 28 C 48 44, 30 46, 26 46 C 34 46, 54 50, 52 70 C 50 92, 22 98, 8 84"/>
  </defs>
  <mask id="knockout">
    <circle cx="64" cy="64" r="62" fill="white"/>
    <g fill="none" stroke="black" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <use href="#d1" transform="translate(8 42) scale(0.44)"/>
      <use href="#d2" transform="translate(30 42) scale(0.44)"/>
    </g>
    <circle cx="98" cy="64" r="24" fill="black"/>
    <path d="M 80 64 L 102 51 L 102 77 Z" fill="white"/>
    <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
      <use href="#d1" stroke-width="30" transform="translate(45.76 14.92) scale(0.26)"/>
      <use href="#d1" stroke-width="30" transform="translate(45.76 86.92) scale(0.26)"/>
      <use href="#d2" stroke-width="42" transform="translate(74.28 18.04) scale(0.12)"/>
      <use href="#d2" stroke-width="42" transform="translate(74.28 98.04) scale(0.12)"/>
      <use href="#d3" stroke-width="56" transform="translate(95.77 28.42) scale(0.072)"/>
      <use href="#d3" stroke-width="56" transform="translate(95.77 92.42) scale(0.072)"/>
    </g>
  </mask>
  <rect width="128" height="128" fill="currentColor" mask="url(#knockout)"/>
</svg>
